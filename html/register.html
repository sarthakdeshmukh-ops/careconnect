<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - CareConnection+</title>
<link rel="stylesheet" href="../css/register.css">
</head>
<body>
  <div class="care-card">
    <div class="care-badge">Your Health, Simplified.</div>
    <h1>Create Your Account</h1>
    <p class="subtitle">Join CareConnection+</p>

    <form action="../php/register_process.php" method="POST" id="registerForm">
      <label>Full Name</label>
      <input type="text" name="full_name" required>

      <label>Unique User ID</label>
      <input type="text" name="unique_user_id" required>

      <label>Email</label>
      <input type="email" name="email" required>

      <label>Password</label>
      <input type="password" name="password" id="password" required>

      <label>Confirm Password</label>
      <input type="password" name="confirm_password" id="confirm_password" required>

      <button type="submit" class="care-btn">Sign Up</button>
    </form>

    <p class="switch-link">Already have an account? <a href="login.html">Log in here</a></p>
  </div>
  <script src="../js/register.js"></script>
</body>
</html>
